name: Refresh ITSM Reports

on:
  schedule:
    - cron: "4-59/10 * * * *"   # every 10 minutes at :04, :14, :24 ... (off the busy round minutes)
  workflow_dispatch:           # "Run workflow" button for a manual refresh
  push:
    branches: [main]           # republish straight away when a report page is changed

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:                 # one refresh at a time; a waiting one runs next
      group: refresh
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull ticket and change lists from the Nema helpdesk
        # Through the Zoho MCP server: only the ticket list and change list tools are enabled there,
        # so attachments, resolutions, notes and conversations cannot be fetched.
        env:
          ZOHO_MCP_URL: ${{ secrets.ZOHO_MCP_URL }}
          ZOHO_MCP_TOKEN: ${{ secrets.ZOHO_MCP_TOKEN }}
        run: python3 scripts/fetch_mcp.py "$RUNNER_TEMP/pages"

      - name: Build report data (stops if the pull was incomplete)
        env:
          REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
        run: |
          pip install --quiet cryptography
          python3 scripts/build_reports.py "$RUNNER_TEMP/pages" site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # GitHub's timer often skips scheduled runs, so each run starts the next one itself about 10 minutes later.
  # Only the newest waiting "next" job survives (cancel-in-progress), so there is never more than one chain;
  # the timer above restarts the chain if it ever stops.
  next:
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    concurrency:
      group: refresh-next
      cancel-in-progress: true
    steps:
      - name: Wait, then start the next refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 530
          gh workflow run refresh.yml --repo "$GITHUB_REPOSITORY" --ref main
