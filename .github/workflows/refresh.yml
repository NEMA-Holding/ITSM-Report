name: Refresh ITSM Reports

on:
  schedule:
    - cron: "4-59/10 * * * *"   # every 10 minutes at :04, :14, :24 ... (off the busy round minutes)
  workflow_dispatch:           # "Run workflow" button for a manual refresh
  push:
    branches: [main]           # republish straight away when a report page is changed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull ticket and change lists from the Nema helpdesk
        # Through the Zoho MCP server: only the ticket list and change list tools are enabled there,
        # so attachments, resolutions, notes and conversations cannot be fetched.
        env:
          ZOHO_MCP_URL: ${{ secrets.ZOHO_MCP_URL }}
          ZOHO_MCP_TOKEN: ${{ secrets.ZOHO_MCP_TOKEN }}
        run: python3 scripts/fetch_mcp.py "$RUNNER_TEMP/pages"

      - name: Build report data (stops if the pull was incomplete)
        env:
          REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
        run: |
          pip install --quiet cryptography
          python3 scripts/build_reports.py "$RUNNER_TEMP/pages" site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
